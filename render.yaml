services:
  - type: web
    name: donation-rank-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: CHARITY_NAVIGATOR_API_KEY
        sync: false
      - key: CHARITY_NAVIGATOR_API_URL
        value: https://api.charitynavigator.org/graphql
